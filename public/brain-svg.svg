<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .brain-stroke {
        fill: none;
        stroke: #0A8754;
        stroke-width: 14;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ray-stroke {
        fill: none;
        stroke: #0A8754;
        stroke-width: 10;
        stroke-linecap: round;
      }
    </style>
  </defs>

  <!-- Surrounding Energy Rays -->
  <g class="ray-stroke">
    <!-- Top Center Ray -->
    <line x1="250" y1="45" x2="250" y2="75" />
    <!-- Top Right Rays -->
    <line x1="330" y1="65" x2="315" y2="90" />
    <line x1="395" y1="120" x2="370" y2="140" />
    <line x1="435" y1="200" x2="405" y2="210" />
    <!-- Top Left Rays -->
    <line x1="170" y1="65" x2="185" y2="90" />
    <line x1="105" y1="120" x2="130" y2="140" />
    <line x1="65" y1="200" x2="95" y2="210" />
  </g>

  <!-- Central Brain Outlines & Gyri -->
  <g class="brain-stroke">
    <!-- Left Brain Outline & Lobes -->
    <path d="M 238,135 
             C 210,132 170,140 150,175 
             C 130,210 135,245 155,270 
             C 135,295 135,335 160,365 
             C 185,395 220,395 238,380" />

    <!-- Left Internal Brain Folds -->
    <path d="M 185,185 C 205,190 220,210 210,230 C 200,250 170,240 160,265" />
    <path d="M 238,205 C 220,205 200,225 215,255 C 225,275 200,295 180,295" />
    <path d="M 238,285 C 215,285 200,310 210,335 C 218,355 190,360 175,345" />

    <!-- Right Brain Outline & Lobes -->
    <path d="M 262,135 
             C 290,132 330,140 350,175 
             C 370,210 365,245 345,270 
             C 365,295 365,335 340,365 
             C 315,395 280,395 262,380" />

    <!-- Right Internal Brain Folds -->
    <path d="M 315,185 C 295,190 280,210 290,230 C 300,250 330,240 340,265" />
    <path d="M 262,205 C 280,205 300,225 285,255 C 275,275 300,295 320,295" />
    <path d="M 262,285 C 285,285 300,310 290,335 C 282,355 310,360 325,345" />

    <!-- Center Hemisphere Separation Line -->
    <line x1="250" y1="125" x2="250" y2="395" stroke-dasharray="16 12" />
  </g>
</svg>
